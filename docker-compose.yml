name: idlecat-excalidraw-plus

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idlecat-excalidraw-plus
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    # 使用 env_file 强制加载同级目录下的 .env
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # 容器间通信使用 minio 服务名，不要写 http://
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=excalidraw
    depends_on:
      minio:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: idlecat-excalidraw-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
